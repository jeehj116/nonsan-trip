<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>논산 여행 코스 추천</title>
<style>
:root{--bg:#fbf7f1;--card:#fff;--text:#2b2420;--sub:#7a6e65;--line:#e9dfd3;--accent:#d8473b;--accent2:#fdeceb;--park:#2563eb;--park2:#e8f0fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1715;--card:#26201d;--text:#f3ece6;--sub:#a99d93;--line:#3a312c;--accent:#ff7a6c;--accent2:#3a2623;--park:#8ab4ff;--park2:#1f2a40}}
:root[data-theme="dark"]{--bg:#1b1715;--card:#26201d;--text:#f3ece6;--sub:#a99d93;--line:#3a312c;--accent:#ff7a6c;--accent2:#3a2623;--park:#8ab4ff;--park2:#1f2a40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:1.9rem;margin:0 0 6px}
.lead{color:var(--sub);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 14px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent2)}
.opt .ic{font-size:2rem;display:block}
.opt b{display:block;margin-top:4px;font-size:1.05rem}
.opt small{color:var(--sub)}
#result{margin-top:28px}
.head h2{margin:0 0 4px;font-size:1.4rem}
.head p{margin:0 0 18px;color:var(--sub)}
.step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex:1;min-width:0}
.box .t{font-size:.8rem;color:var(--accent);font-weight:700}
.box h3{margin:0 0 2px;font-size:1.05rem}
.box p{margin:0;color:var(--sub);font-size:.93rem}
.parking{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--park2);font-size:.88rem}
.parking b{color:var(--park)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns a{font-size:.83rem;text-decoration:none;padding:5px 10px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent2)}
.btns a.pk{border-color:var(--park);color:var(--park);background:var(--park2)}
.btns button.pin{font:inherit;font-size:.83rem;padding:5px 10px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent2);cursor:pointer}
.mapbox{margin-top:10px}
.mapbox iframe{width:100%;height:220px;border:0;border-radius:10px;background:var(--line)}
.mapbox .links{margin-top:6px;font-size:.85rem}
.mapbox .links a{color:var(--accent);margin-right:12px}
.note{font-size:.82rem;color:var(--sub);margin-top:10px}
.comm{text-align:center;margin-top:36px}
.comm a{display:inline-block;color:var(--accent);border:1.5px solid var(--accent);background:var(--accent2);text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:700}
.hint{text-align:center;color:var(--sub);padding:28px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>논산 여행 코스 🍓</h1>
  <p class="lead">어떤 여행을 원하세요? 하나를 골라보세요.</p>
  <div class="grid" id="grid"></div>
  <div id="result"><div class="hint">위에서 여행 스타일을 선택하면 코스가 나타나요.</div></div>
  <p class="comm"><a href="community.html">💬 나만의 논산 코스 공유하기 · 다른 사람 코스 보기</a></p>
</div>
<script>
// 각 장소: t 시간대, n 이름, d 설명, q 지도 검색어, pq 주차장 검색어(생략 시 q+" 주차장"), pn 주차 안내
var OK="주차장이 있는 곳으로 알고 있어요. 방문 전에 지도로 확인하세요.";
var GEN="정해진 가게가 없어서 주변 주차장을 지도에서 검색해요.";
var DATA={
walk:{ic:"🚶",name:"뚜벅이",sub:"대중교통 + 걷기",park:false,title:"뚜벅이 코스: 강경 근대 골목 도보 여행",desc:"논산역에서 버스로 강경으로 이동해, 걸어서 둘러보는 당일 코스",steps:[
{t:"오전",n:"논산역에서 강경 이동",d:"버스로 강경 읍내까지 이동해요. 배차 간격은 미리 확인하세요.",q:"논산역"},
{t:"오전",n:"강경 근대문화 골목",d:"옛 건물과 골목이 이어져 걸으며 구경하기 좋아요.",q:"강경 근대문화거리"},
{t:"점심",n:"강경 젓갈 백반",d:"젓갈 골목 근처 식당에서 한 끼.",q:"강경 젓갈백반"},
{t:"오후",n:"강경 젓갈시장 구경",d:"젓갈 가게를 둘러보고 선물을 골라요.",q:"강경젓갈시장"},
{t:"오후",n:"옥녀봉 전망",d:"금강이 내려다보이는 가벼운 산책 코스.",q:"강경 옥녀봉"},
{t:"저녁",n:"금강 노을 보고 귀가",d:"강변에서 노을을 보고 버스로 돌아와요.",q:"강경 금강변"}]},
tour:{ic:"🏯",name:"관광",sub:"명소 중심",park:true,title:"관광 코스: 논산 대표 명소 한 바퀴",desc:"자동차 기준, 역사와 풍경을 하루에 보는 코스",steps:[
{t:"오전",n:"관촉사 (은진미륵)",d:"큰 석불 입상으로 유명한 논산의 대표 사찰.",q:"관촉사",pn:OK},
{t:"점심",n:"논산 시내 식사",d:"한식당에서 점심.",q:"논산 맛집",pq:"논산 시내 주차장",pn:GEN},
{t:"오후",n:"선샤인랜드",d:"근대 드라마 세트 분위기의 촬영지 테마 공간.",q:"논산 선샤인랜드",pn:OK},
{t:"오후",n:"탑정호 출렁다리",d:"호수 위를 걷는 긴 출렁다리와 수변 풍경.",q:"탑정호 출렁다리",pn:OK},
{t:"저녁",n:"탑정호 노을·야경",d:"호수 주변에서 해 질 녘 산책.",q:"탑정호",pq:"탑정호 주차장",pn:OK}]},
food:{ic:"🍽️",name:"식도락",sub:"맛집·특산물",park:true,title:"식도락 코스: 논산의 맛 따라가기",desc:"딸기, 젓갈, 곶감 등 논산 먹거리 중심 코스",steps:[
{t:"오전",n:"논산 딸기 디저트",d:"딸기 철에는 딸기 디저트 카페를 먼저 들러요.",q:"논산 딸기 카페",pq:"논산 주차장",pn:GEN},
{t:"점심",n:"강경 젓갈 백반",d:"젓갈이 곁들여진 백반 한 상.",q:"강경 젓갈백반",pq:"강경 주차장",pn:GEN},
{t:"오후",n:"강경 젓갈시장",d:"젓갈 시식과 구매.",q:"강경젓갈시장",pn:GEN},
{t:"오후",n:"지역 시장 간식",d:"시장에서 간식과 특산물 구경.",q:"논산 화지중앙시장",pn:GEN},
{t:"저녁",n:"향토 음식 저녁",d:"논산 시내에서 저녁. 특산물 요리를 찾아보세요.",q:"논산 맛집",pq:"논산 시내 주차장",pn:GEN}],
note:"딸기는 겨울~봄이 제철이고, 곶감은 가을~겨울이에요. 계절을 확인하세요."},
family:{ic:"👨‍👩‍👧",name:"가족 체험",sub:"아이와 함께",park:true,title:"가족 체험 코스: 아이와 함께 즐기기",desc:"체험과 놀거리를 섞은 가족 당일 코스",steps:[
{t:"오전",n:"딸기 따기 체험 (철 한정)",d:"체험 농장을 사전에 예약하고 방문해요.",q:"논산 딸기체험농장",pn:"농장마다 달라서 예약할 때 주차 가능 여부를 꼭 물어보세요."},
{t:"점심",n:"가족 식사",d:"아이가 먹기 편한 메뉴로 점심.",q:"논산 가족 식당",pq:"논산 주차장",pn:GEN},
{t:"오후",n:"선샤인랜드",d:"아이들과 사진 찍고 구경하기 좋아요.",q:"논산 선샤인랜드",pn:OK},
{t:"오후",n:"백제군사박물관",d:"역사를 쉽게 보는 전시 공간.",q:"백제군사박물관",pn:OK},
{t:"저녁",n:"탑정호 수변 산책",d:"가볍게 걸으며 하루 마무리.",q:"탑정호 수변생태공원",pq:"탑정호 수변생태공원 주차장",pn:OK}]}
};
var keys=Object.keys(DATA),grid=document.getElementById("grid"),res=document.getElementById("result");
function K(q){return "https://map.kakao.com/link/search/"+encodeURIComponent(q)}
function N(q){return "https://map.naver.com/p/search/"+encodeURIComponent(q)}
keys.forEach(function(k){var d=DATA[k],b=document.createElement("button");b.className="opt";b.id="o-"+k;
b.innerHTML='<span class="ic">'+d.ic+'</span><b>'+d.name+'</b><small>'+d.sub+'</small>';
b.onclick=function(){show(k)};grid.appendChild(b)});
function show(k){var d=DATA[k];
keys.forEach(function(x){document.getElementById("o-"+x).classList.toggle("on",x===k)});
var h='<div class="head"><h2>'+d.title+'</h2><p>'+d.desc+'</p></div>';
d.steps.forEach(function(s,i){
var pq=s.pq||(s.q+" 주차장");
h+='<div class="step"><div class="num">'+(i+1)+'</div><div class="box">'
+'<div class="t">'+s.t+'</div><h3>'+s.n+'</h3><p>'+s.d+'</p>'
+(d.park&&s.pn?'<div class="parking"><b>🅿️ 주차</b> '+s.pn+'</div>':'')
+'<div class="btns"><button class="pin" data-q="'+s.q+'">📍 지도 보기</button>'
+(d.park?'<a class="pk" target="_blank" rel="noopener" href="'+K(pq)+'">🅿️ 주변 주차장 (카카오)</a><a class="pk" target="_blank" rel="noopener" href="'+N(pq)+'">🅿️ 주변 주차장 (네이버)</a>':'')
+'</div><div class="mapbox" hidden></div></div></div>'});
h+='<div class="note">'+(d.note?d.note+"<br>":"")+"※ 운영시간, 휴무일, 주차 가능 여부는 방문 전에 꼭 확인하세요.</div>";
res.innerHTML=h;
res.querySelectorAll(".pin").forEach(function(p){p.onclick=function(){
var m=p.closest(".box").querySelector(".mapbox"),q=p.getAttribute("data-q"),e=encodeURIComponent(q);
if(!m.hasChildNodes()){m.innerHTML='<iframe loading="lazy" src="https://maps.google.com/maps?q='+e+'&output=embed&hl=ko" title="'+q+' 지도"></iframe><div class="links"><a target="_blank" rel="noopener" href="'+K(q)+'">카카오맵</a><a target="_blank" rel="noopener" href="'+N(q)+'">네이버지도</a></div>'}
m.hidden=!m.hidden;p.textContent=m.hidden?"📍 지도 보기":"✕ 지도 닫기"}});
try{history.replaceState(null,"","#"+k)}catch(e){}
res.scrollIntoView({behavior:"smooth",block:"start"})}
var h0=(location.hash||"").slice(1);if(DATA[h0])show(h0);
</script>
</body>
</html>
